name        = "test_motor"
description = "RP2040 Embedded Profile Firmware"
version     = "1.0.0"
executables = ["test_motor"]
[configuration]
auto_gpr_with = true
disabled = false
generate_ada = true
generate_c = true
generate_gpr = true
output_dir = "config"
[configuration.values]
[configuration.values.embedded_rp2040]
Board = "generic_board"
Max_CPUs = 2
[configuration.values.rp2040_hal]
Interrupts = "bb_runtimes"
Use_Startup = false
[[actions]]
command = [
"sh",
"-c",
"./postbuild.sh",
]
directory = "."
type = "post-build"
[[depends-on]]
embedded_rp2040 = "^16"
rp2040_hal = "^2"

[[depends-on]]
munts_rp2040_lib_embedded = "^16"
